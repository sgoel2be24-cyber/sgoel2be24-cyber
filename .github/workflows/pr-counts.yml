name: pr-counts

# The upstream-contribution counters on the profile README are generated here
# rather than typed. Hand-typed counters drift slowly and silently, which is
# the exact failure this profile claims not to have.
#
# Two things are counted, and both are verified against GitHub at run time:
#
#   1. PRs GitHub itself reports as merged into someone else's repository.
#
#   2. PRs that landed through a maintainer's import bot. Google's adk-python
#      runs Copybara: the patch is imported, committed to main authored by the
#      contributor, and the PR is then labelled "merged" and closed. GitHub's
#      search index does not count these, because the commit that reaches main
#      has a different SHA than anything on the PR branch. They are real merges
#      and are counted here -- but only after this workflow confirms, for each
#      one, that the named commit exists on the upstream default branch AND is
#      authored by this account. An entry that stops verifying stops counting.
#
# Nothing in this file lets a number go up without a commit backing it.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-counts.yml'

permissions:
  contents: write

concurrency:
  group: pr-counts
  cancel-in-progress: false

env:
  # repo:commit:pr -- landings to verify and count. One per line.
  IMPORT_LANDINGS: |
    google/adk-python:6f6106f672d26596f909bd555e954825ba4044b4:6419

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - name: Query GitHub search
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
          USER_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # -user:<login> excludes the author's own repositories, so these count
          # contributions to other people's projects only.
          merged="$(gh api -X GET search/issues \
            -f q="author:${USER_LOGIN} is:pr is:merged -user:${USER_LOGIN}" \
            --jq '.total_count')"

          open_count="$(gh api -X GET search/issues \
            -f q="author:${USER_LOGIN} is:pr is:open -user:${USER_LOGIN}" \
            --jq '.total_count')"

          # A transient API hiccup returning an empty string would otherwise
          # publish a blank badge; refuse instead and keep the previous values.
          case "$merged" in ''|*[!0-9]*) echo "bad merged count: '$merged'" >&2; exit 1;; esac
          case "$open_count" in ''|*[!0-9]*) echo "bad open count: '$open_count'" >&2; exit 1;; esac

          echo "GitHub-indexed merges: $merged"

          # --- verify each import-bot landing -------------------------------
          landed=0
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            repo="${entry%%:*}"; rest="${entry#*:}"
            sha="${rest%%:*}";  pr="${rest##*:}"

            # The commit must exist on the upstream default branch and be
            # authored by this account. Either check failing drops the entry.
            author="$(gh api "repos/${repo}/commits/${sha}" --jq '.author.login // empty' 2>/dev/null || true)"
            if [ "$author" != "$USER_LOGIN" ]; then
              echo "SKIP ${repo}#${pr}: ${sha} not authored by ${USER_LOGIN} (got '${author:-none}')" >&2
              continue
            fi

            default_branch="$(gh api "repos/${repo}" --jq '.default_branch')"
            reachable="$(gh api -X GET "repos/${repo}/compare/${default_branch}...${sha}" --jq '.status' 2>/dev/null || true)"
            if [ "$reachable" != "identical" ] && [ "$reachable" != "behind" ]; then
              echo "SKIP ${repo}#${pr}: ${sha} not reachable from ${default_branch} (status '${reachable:-none}')" >&2
              continue
            fi

            # Guard against double counting if the PR is ever also indexed as merged.
            pr_merged="$(gh api "repos/${repo}/pulls/${pr}" --jq '.merged' 2>/dev/null || echo false)"
            if [ "$pr_merged" = "true" ]; then
              echo "SKIP ${repo}#${pr}: already counted by GitHub search" >&2
              continue
            fi

            echo "OK   ${repo}#${pr} landed as ${sha:0:7}"
            landed=$((landed + 1))
          done <<< "${IMPORT_LANDINGS}"

          total=$((merged + landed))
          echo "merged=$total" >> "$GITHUB_OUTPUT"
          echo "open=$open_count" >> "$GITHUB_OUTPUT"
          echo "Merged upstream: $total (${merged} indexed + ${landed} imported) | open: $open_count"

      - name: Publish badge endpoints
        run: |
          set -e
          stamp="$(date -u +'%Y-%m-%d')"
          rm -rf .badges && mkdir .badges
          cd .badges
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin badges 2>/dev/null; then
            git checkout -q FETCH_HEAD -- . 2>/dev/null || true
            git checkout -qb badges
          else
            git checkout -qb badges
          fi

          write_badge () {
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$1" "$2" "$3" > "$4"
          }

          write_badge "merged upstream" "${{ steps.q.outputs.merged }}" "38BDAF" pr-merged.json
          write_badge "in review"       "${{ steps.q.outputs.open }}"   "203a43" pr-open.json
          write_badge "counts checked"  "$stamp"                        "6f7c7a" pr-checked.json

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "pr-counts: ${stamp}" || { echo "nothing changed"; exit 0; }
          git push -q --force origin badges
