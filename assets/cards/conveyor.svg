<svg xmlns="http://www.w3.org/2000/svg" width="440" height="252" viewBox="0 0 440 252" role="img" aria-label="conveyor: jobs are appended to a write-ahead log, the broker is killed with kill -9, the log is replayed in 7.7 ms and no job is lost">
  <title>conveyor: jobs are appended to a write-ahead log, the broker is killed with kill -9, the log is replayed in 7.7 ms and no job is lost</title>
  <style>
    svg {
      --bg:#f6f8fa; --bd:#d0d7de; --fg:#1f2328; --mu:#59636e; --gd:#d8dee4;
      --bl:#0969da; --gr:#1a7f37; --rd:#cf222e; --am:#bf8700; --amt:#9a6700;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg:#161b22; --bd:#30363d; --fg:#e6edf3; --mu:#8b949e; --gd:#262c36;
        --bl:#4493f8; --gr:#3fb950; --rd:#f85149; --am:#d29922; --amt:#d29922;
      }
    }
    .bg { fill:var(--bg); stroke:var(--bd); }
    .t  { font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif; font-size:19px; font-weight:600; fill:var(--fg); }
    .st { font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif; font-size:13px; fill:var(--mu); }
    .m  { font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; font-size:11px; fill:var(--mu); }
    .mf { font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; font-size:11px; fill:var(--fg); }
    .ft { font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; font-size:11.5px; fill:var(--fg); }
    .lg { font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; font-size:11px; fill:var(--mu); text-anchor:end; }
    .ax { stroke:var(--gd); stroke-width:1; }
    .fbl { fill:var(--bl); } .fgr { fill:var(--gr); } .frd { fill:var(--rd); } .fam { fill:var(--am); }
    .tbl { fill:var(--bl); } .tgr { fill:var(--gr); } .trd { fill:var(--rd); } .tam { fill:var(--amt); }
    .sbl { stroke:var(--bl); } .sgr { stroke:var(--gr); } .srd { stroke:var(--rd); } .sam { stroke:var(--am); }
    .smu { stroke:var(--mu); }
    .anim { animation-duration:12.0s; animation-iteration-count:infinite; animation-delay:0s; }
    .sweep { transform-box:fill-box; transform-origin:0 50%; animation-name:sweep; animation-timing-function:linear; }
    .ph    { opacity:0; animation-name:ph; animation-timing-function:linear; }
    .trace { animation-name:fade; }
    .late  { animation-name:late; }
    @keyframes sweep { 0% { transform:scaleX(0); } 46.0% { transform:scaleX(1); } 100% { transform:scaleX(1); } }
    @keyframes ph {
      0% { transform:translateX(0); opacity:1; }
      46.0% { transform:translateX(320px); opacity:1; }
      49.0% { transform:translateX(320px); opacity:0; }
      100% { transform:translateX(320px); opacity:0; }
    }
    @keyframes fade { 0% { opacity:1; } 94.0% { opacity:1; } 97.5% { opacity:0; } 100% { opacity:0; } }
    @keyframes late { 0% { opacity:0; } 46.0% { opacity:0; } 48.0% { opacity:1; } 100% { opacity:1; } }
    
    .rp { animation-name:rp; }
    @keyframes rp { 0% { opacity:0; } 20.35% { opacity:0; } 21.85% { opacity:1; } 52.00% { opacity:1; } 56.00% { opacity:.35; } 100% { opacity:.35; } }
    @media (prefers-reduced-motion: reduce) { .anim { animation:none; } }
  </style>
  <defs>
    <clipPath id="reveal-conveyor"><rect class="sweep anim" x="102" y="70" width="322" height="144"/></clipPath>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="439" height="251" rx="10"/>
  <text class="t" x="24" y="34">conveyor</text>
  <text class="m" x="416" y="33" text-anchor="end">Go</text>
  <text class="st" x="24" y="55">A job queue that loses nothing to kill -9</text>
  <text class="lg" x="92" y="104">submit</text>
  <line class="ax" x1="104" y1="100" x2="416" y2="100" stroke-dasharray="2 4"/>
  <text class="lg" x="92" y="140">WAL</text>
  <line class="ax" x1="104" y1="136" x2="416" y2="136" stroke-dasharray="2 4"/>
  <text class="lg" x="92" y="176">broker</text>
  <line class="ax" x1="104" y1="172" x2="416" y2="172" stroke-dasharray="2 4"/>
  <g class="trace anim">
    <g clip-path="url(#reveal-conveyor)">
      <rect class="fbl" x="112" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="116" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="132" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="136" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="152" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="156" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="172" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="176" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="192" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="196" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="298" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="302" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="318" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="322" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="338" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="342" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="358" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="362" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="378" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="382" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><rect class="fbl" x="398" y="95" width="10" height="10" rx="2"/><rect class="fgr" x="402" y="129" width="12" height="14" rx="1.5" fill-opacity="0.85"/><line class="srd" x1="214" y1="84" x2="214" y2="186" stroke-width="1.25" stroke-dasharray="3 3"/><text class="mf trd" x="220" y="86" font-weight="700">kill -9</text><rect class="fgr" x="104" y="168" width="110" height="8" rx="2"/><path class="srd" d="M209 167 l10 10 m0 -10 l-10 10" stroke-width="2" stroke-linecap="round"/><rect class="fam" x="242" y="168" width="30" height="8" rx="2"/><text class="m tam" x="238" y="194">replay 7.7 ms</text><rect class="fgr" x="274" y="168" width="142" height="8" rx="2"/>
    </g>
    <g class="rp anim"><rect class="sam" x="114.5" y="127.5" width="15" height="17" rx="2.5" fill="none" stroke-width="1.6"/><rect class="sam" x="134.5" y="127.5" width="15" height="17" rx="2.5" fill="none" stroke-width="1.6"/><rect class="sam" x="154.5" y="127.5" width="15" height="17" rx="2.5" fill="none" stroke-width="1.6"/><rect class="sam" x="174.5" y="127.5" width="15" height="17" rx="2.5" fill="none" stroke-width="1.6"/><rect class="sam" x="194.5" y="127.5" width="15" height="17" rx="2.5" fill="none" stroke-width="1.6"/></g>
  </g>
  <line class="ph anim" x1="104" y1="78" x2="104" y2="204" stroke="var(--fg)" stroke-width="1.25" stroke-opacity="0.55"/>
  <text class="ft" x="24" y="234">0 jobs lost in 50 kill -9 trials</text>
</svg>
