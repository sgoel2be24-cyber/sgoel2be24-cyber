<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img" aria-label="Recent shipped work">
  <title>Recent shipped work</title>
  <style>
    .ln {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px; font-weight: 500; fill: #1f2328;
    }
    .pl  { fill: #1a7f37; font-weight: 700; }
    .sha { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .ln  { fill: #e6edf3; }
      .pl  { fill: #3fb950; }
      .sha { fill: #7d8590; }
    }
    #reel { animation: roll 37.95s steps(1, end) infinite; }
    @media (prefers-reduced-motion: no-preference) {
      #reel { animation: roll 37.95s cubic-bezier(.2,.8,.2,1) infinite; }
    }
    @keyframes roll {
    0.0000% { transform: translateY(0px); }
    7.6417% { transform: translateY(0px); }
    9.0909% { transform: translateY(-44px); }
    16.7326% { transform: translateY(-44px); }
    18.1818% { transform: translateY(-88px); }
    25.8235% { transform: translateY(-88px); }
    27.2727% { transform: translateY(-132px); }
    34.9144% { transform: translateY(-132px); }
    36.3636% { transform: translateY(-176px); }
    44.0053% { transform: translateY(-176px); }
    45.4545% { transform: translateY(-220px); }
    53.0962% { transform: translateY(-220px); }
    54.5455% { transform: translateY(-264px); }
    62.1871% { transform: translateY(-264px); }
    63.6364% { transform: translateY(-308px); }
    71.2780% { transform: translateY(-308px); }
    72.7273% { transform: translateY(-352px); }
    80.3689% { transform: translateY(-352px); }
    81.8182% { transform: translateY(-396px); }
    89.4598% { transform: translateY(-396px); }
    90.9091% { transform: translateY(-440px); }
    98.5507% { transform: translateY(-440px); }
    100.0000% { transform: translateY(-484px); }
    }
  </style>
  <g id="reel">
  <text x="450" y="22.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>shipped a 48-operation Pinecone integration into Corsair  <tspan class="sha">f7820d6</tspan></text>
  <text x="450" y="66.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>merged a file-descriptor leak fix into NumPy  <tspan class="sha">444afc2</tspan></text>
  <text x="450" y="110.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>patched Windows path parsing in Google&apos;s Agent Development Kit  <tspan class="sha">6f6106f</tspan></text>
  <text x="450" y="154.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>landed two bug fixes in Apache Airflow  <tspan class="sha">c5d7f60</tspan></text>
  <text x="450" y="198.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>fixed the license-compliance audit in Apache Magpie  <tspan class="sha">99c983b</tspan></text>
  <text x="450" y="242.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>closed a CLI dry-run hole in Cognee  <tspan class="sha">2de7ab0</tspan></text>
  <text x="450" y="286.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>built a Go job queue that survives kill -9 with zero job loss  <tspan class="sha">conveyor</tspan></text>
  <text x="450" y="330.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>wrote a ReDoS analyzer that proves each finding with an attack string  <tspan class="sha">redoscope</tspan></text>
  <text x="450" y="374.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>built an incremental build engine with a content-addressed cache  <tspan class="sha">forgegraph</tspan></text>
  <text x="450" y="418.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>built an offline screen assistant for blind users on the Snapdragon NPU  <tspan class="sha">netra</tspan></text>
  <text x="450" y="462.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>built an Android assistant you teach by doing a task once  <tspan class="sha">teachable-voice</tspan></text>
  <text x="450" y="506.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>shipped a 48-operation Pinecone integration into Corsair  <tspan class="sha">f7820d6</tspan></text>
  </g>
</svg>
