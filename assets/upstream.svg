<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img" aria-label="Recent shipped work">
  <title>Recent shipped work</title>
  <style>
    .ln {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px; font-weight: 500; fill: #1f2328;
    }
    .pl  { fill: #1a7f37; font-weight: 700; }
    .sha { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .ln  { fill: #e6edf3; }
      .pl  { fill: #3fb950; }
      .sha { fill: #7d8590; }
    }
    #reel { animation: roll 48.3s steps(1, end) infinite; }
    @media (prefers-reduced-motion: no-preference) {
      #reel { animation: roll 48.3s cubic-bezier(.2,.8,.2,1) infinite; }
    }
    @keyframes roll {
    0.0000% { transform: translateY(0px); }
    6.0042% { transform: translateY(0px); }
    7.1429% { transform: translateY(-44px); }
    13.1470% { transform: translateY(-44px); }
    14.2857% { transform: translateY(-88px); }
    20.2899% { transform: translateY(-88px); }
    21.4286% { transform: translateY(-132px); }
    27.4327% { transform: translateY(-132px); }
    28.5714% { transform: translateY(-176px); }
    34.5756% { transform: translateY(-176px); }
    35.7143% { transform: translateY(-220px); }
    41.7184% { transform: translateY(-220px); }
    42.8571% { transform: translateY(-264px); }
    48.8613% { transform: translateY(-264px); }
    50.0000% { transform: translateY(-308px); }
    56.0042% { transform: translateY(-308px); }
    57.1429% { transform: translateY(-352px); }
    63.1470% { transform: translateY(-352px); }
    64.2857% { transform: translateY(-396px); }
    70.2899% { transform: translateY(-396px); }
    71.4286% { transform: translateY(-440px); }
    77.4327% { transform: translateY(-440px); }
    78.5714% { transform: translateY(-484px); }
    84.5756% { transform: translateY(-484px); }
    85.7143% { transform: translateY(-528px); }
    91.7184% { transform: translateY(-528px); }
    92.8571% { transform: translateY(-572px); }
    98.8613% { transform: translateY(-572px); }
    100.0000% { transform: translateY(-616px); }
    }
  </style>
  <g id="reel">
  <text x="450" y="22.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>ranked #1 on the OSCI&apos;26 leaderboard with 240+ merged PRs  <tspan class="sha">osci&apos;26</tspan></text>
  <text x="450" y="66.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>won a special award at the HackBlox 2026 open-source hackathon  <tspan class="sha">hackblox</tspan></text>
  <text x="450" y="110.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>reached the DataForge 2026 finals at IIT Kharagpur  <tspan class="sha">dataforge</tspan></text>
  <text x="450" y="154.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>shipped a 48-operation Pinecone integration into Corsair  <tspan class="sha">f7820d6</tspan></text>
  <text x="450" y="198.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>merged a file-descriptor leak fix into NumPy  <tspan class="sha">444afc2</tspan></text>
  <text x="450" y="242.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>patched Windows path parsing in Google&apos;s Agent Development Kit  <tspan class="sha">6f6106f</tspan></text>
  <text x="450" y="286.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>landed two bug fixes in Apache Airflow  <tspan class="sha">c5d7f60</tspan></text>
  <text x="450" y="330.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>fixed the license-compliance audit in Apache Magpie  <tspan class="sha">99c983b</tspan></text>
  <text x="450" y="374.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>closed a CLI dry-run hole in Cognee  <tspan class="sha">2de7ab0</tspan></text>
  <text x="450" y="418.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>built a Go job queue that survives kill -9 with zero job loss  <tspan class="sha">conveyor</tspan></text>
  <text x="450" y="462.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>wrote a ReDoS analyzer that proves each finding with an attack string  <tspan class="sha">redoscope</tspan></text>
  <text x="450" y="506.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>built an incremental build engine with a content-addressed cache  <tspan class="sha">forgegraph</tspan></text>
  <text x="450" y="550.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>built an offline screen assistant for blind users on the Snapdragon NPU  <tspan class="sha">netra</tspan></text>
  <text x="450" y="594.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>built an Android assistant you teach by doing a task once  <tspan class="sha">teachable-voice</tspan></text>
  <text x="450" y="638.0" class="ln" dominant-baseline="middle" text-anchor="middle"><tspan class="pl">+ </tspan>ranked #1 on the OSCI&apos;26 leaderboard with 240+ merged PRs  <tspan class="sha">osci&apos;26</tspan></text>
  </g>
</svg>
